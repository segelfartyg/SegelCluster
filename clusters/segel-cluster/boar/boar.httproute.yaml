apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boar
  namespace: boar
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - boar.swaren.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: boar
          port: 8080

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 15m
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: "17.*"
      sourceRef:
        kind: HelmRepository
        name: loki
      interval: 5m
  releaseName: loki
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage_config:
        aws:
          region: <AWS region your bucket is in, for example, `eu-west-2`>
          bucketnames: <Your AWS bucket for chunk, for exaxmple,  `aws-loki-dev-chunk`>
          s3forcepathstyle: true
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 672h # 28 days retention

      storage:
        type: s3
        bucketNames:
          chunks: <Your AWS bucket for chunk, for example, `aws-loki-dev-chunk`>
          ruler: <Your AWS bucket for ruler, for example, `aws-loki-dev-ruler`>
          admin: <Your AWS bucket for admin, for example, `aws-loki-dev-admin`>
        s3:
          # s3 URL can be used to specify the endpoint, access key, secret key, and bucket name this works well for S3 compatible storages or are hosting Loki on-premises and want to use S3 as the storage backend. Either use the s3 URL or the individual fields below (AWS endpoint, region, secret).
          s3: s3://access_key:secret_access_key@custom_endpoint/bucket_name
          # AWS endpoint URL
          endpoint: <your-endpoint>
          # AWS region where the S3 bucket is located
          region: <your-region>
          # AWS secret access key
          secretAccessKey: <your-secret-access-key>
          # AWS access key ID
          accessKeyId: <your-access-key-id>
          # AWS signature version (e.g., v2 or v4)
          signatureVersion: <your-signature-version>
          # Forces the path style for S3 (true/false)
          s3ForcePathStyle: true
          # Allows insecure (HTTP) connections (true/false)
          insecure: false
          # HTTP configuration settings
          http_config: {}

    # Disable minio storage
    minio:
      enabled: false

    deploymentMode: Monolithic

    singleBinary:
      replicas: 1
      persistence:
        storageClass: gp2
        accessModes:
          - ReadWriteOnce
        size: 5Gi

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

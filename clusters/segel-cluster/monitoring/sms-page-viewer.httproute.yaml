apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sms-page-viewer
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sms-page-viewer
          port: 5174
